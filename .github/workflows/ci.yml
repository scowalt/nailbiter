name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_DISABLE_TOOLS: asdf:mise-plugins/mise-dotnet-core,bun

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      marketing: ${{ steps.marketing.outputs.changed }}
      marketing-sha256: ${{ steps.package-marketing.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.11.5
          sha256: 7a5b051d6f17d335c502f8047a5175cf3103f347d91942771c60da4e302ebcb0
          cache: false
      - name: Verify event checkout and synthetic fixture provenance
        run: |
          sh scripts/ci/verify-checkout.sh
          python scripts/test-fixtures/generate.py --check
      - name: Source policy and secret scan
        run: |
          uv venv "$RUNNER_TEMP/comment-policy"
          uv pip install --python "$RUNNER_TEMP/comment-policy" --require-hashes --no-build -r .comment-policy/requirements.txt
          "$RUNNER_TEMP/comment-policy/bin/python" .comment-policy/check.py
          "$RUNNER_TEMP/comment-policy/bin/python" -m unittest discover -s .comment-policy -v
          gitleaks git --config .gitleaks.toml --redact=100 --log-opts=--all
      - name: Install the pinned .NET SDK
        run: sh scripts/ci/install-dotnet-sdk.sh
      - name: Check that dotnet is the pinned SDK
        run: sh scripts/ci/check-dotnet-sdk.sh
      - name: Install pinned bun
        run: sh scripts/ci/install-bun.sh
      - name: Lint and browser regressions
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run lint
          bunx playwright install --with-deps chromium
          bun run test:live-sync
          bash -n scripts/ensure-swap.sh scripts/ci/*.sh
      - name: Deployment and fixture contracts
        run: |
          python -m unittest discover -s tests/deployment -p 'test_*.py' -v
          uv venv "$RUNNER_TEMP/tests-ci"
          uv pip install --python "$RUNNER_TEMP/tests-ci" --require-hashes --no-build -r scripts/ci/tests-ci-requirements.txt
          "$RUNNER_TEMP/tests-ci/bin/python" -m unittest discover -s tests/ci -p 'test_*.py' -v
          python -m unittest discover -s tests/fixtures -p 'test_*.py' -v
      - name: Analysis and isolated database recovery
        run: |
          uv venv "$RUNNER_TEMP/analysis"
          uv pip install --python "$RUNNER_TEMP/analysis" --require-hashes --no-build -r scripts/ci/analysis-requirements.txt
          cd apps/analysis
          PYTHONPATH=src "$RUNNER_TEMP/analysis/bin/python" -m unittest discover -s tests -v
          cd ../..
          RUN_RECOVERY_DB_TESTS=1 python -m unittest discover -s scripts/backfills -p 'test_*.py' -v
      - name: Build web components independently
        run: |
          bun install --cwd apps/web-components --frozen-lockfile --ignore-scripts
          bun run --cwd apps/web-components build --outdir ../../.ci/web-components
      - name: Backend build and F# suite
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          dotnet restore apps/backend/backend.csproj
          dotnet restore apps/backend.fsharp.tests/backend.fsharp.tests.fsproj
          dotnet build apps/backend/backend.csproj --no-restore --configuration Release
          dotnet test apps/backend.fsharp.tests/backend.fsharp.tests.fsproj --no-restore --configuration Release
      - name: Build and package marketing once
        id: package-marketing
        run: |
          bun install --cwd apps/www --frozen-lockfile --ignore-scripts
          bun run --cwd apps/www build
          bun run test:icons
          (cd apps/www && bunx wrangler --version)
          mkdir -p .ci
          tar -C apps/www -cf .ci/marketing.tar dist
          digest=$(sha256sum .ci/marketing.tar | cut -d ' ' -f 1)
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$GITHUB_SHA" > .ci/marketing.commit
      - name: Select marketing release paths
        id: marketing
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/ci/marketing-changed.py >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: marketing-${{ github.sha }}
          path: |
            .ci/marketing.tar
            .ci/marketing.commit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  listing-checker:
    name: Package the listing checker
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned .NET SDK
        run: sh scripts/ci/install-dotnet-sdk.sh
      - name: Check that dotnet is the pinned SDK
        run: sh scripts/ci/check-dotnet-sdk.sh
      - name: Publish the self-contained checker
        id: package
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          sh scripts/ci/verify-checkout.sh
          sh scripts/ci/package-listing-check.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: listing-checker-${{ github.sha }}
          path: |
            .ci/listing-checker.tar
            .ci/listing-checker.commit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  backend-tests:
    name: Backend integration tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.11.5
          sha256: 7a5b051d6f17d335c502f8047a5175cf3103f347d91942771c60da4e302ebcb0
          cache: false
      - name: Install the pinned .NET SDK
        run: sh scripts/ci/install-dotnet-sdk.sh
      - name: Check that dotnet is the pinned SDK
        run: sh scripts/ci/check-dotnet-sdk.sh
      - name: Build the C# test suite
        run: |
          sh scripts/ci/verify-checkout.sh
          dotnet restore apps/backend.tests/backend.tests.csproj
          dotnet build apps/backend.tests/backend.tests.csproj --no-restore --configuration Release
      - name: Run this shard's test classes
        run: python scripts/ci/backend-test-shard.py ${{ strategy.job-index }} ${{ strategy.job-total }}

  validate:
    name: Validate
    needs: [checks, backend-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      marketing: ${{ needs.checks.outputs.marketing }}
      marketing-sha256: ${{ needs.checks.outputs.marketing-sha256 }}
    steps:
      - name: Require every validation job
        env:
          CHECKS: ${{ needs.checks.result }}
          BACKEND_TESTS: ${{ needs.backend-tests.result }}
        run: |
          echo "Checks: $CHECKS, backend integration tests: $BACKEND_TESTS"
          test "$CHECKS" = success
          test "$BACKEND_TESTS" = success

  image:
    name: Build and scan backend image
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.bind.outputs.sha256 }}
      image-id: ${{ steps.bind.outputs.image-id }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build image without publishing
        run: |
          sh scripts/ci/verify-checkout.sh
          sh scripts/ci/build-image.sh
      - name: Install pinned Trivy
        run: sh scripts/ci/install-trivy.sh
      - name: Scan the exact image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          skip-setup-trivy: true
          cache: false
          image-ref: nailbiter-backend:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
      - name: Bind the scanned image to this revision
        id: bind
        run: |
          digest=$(sha256sum .ci/backend.tar | cut -d ' ' -f 1)
          image_id=$(docker image inspect --format '{{.Id}}' nailbiter-backend:scan)
          printf 'sha256=%s\nimage-id=%s\n' "$digest" "$image_id" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$GITHUB_SHA" > .ci/backend.commit
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: backend-${{ github.sha }}
          path: |
            .ci/backend.tar
            .ci/backend.commit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release production
    needs: [validate, image, listing-checker]
    if: >-
      github.repository == 'scowalt/nailbiter' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.PRODUCTION_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production-release
      cancel-in-progress: false
    env:
      PRODUCTION_RELEASES_ENABLED: ${{ vars.PRODUCTION_RELEASES_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned bun
        run: sh scripts/ci/install-bun.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: backend-${{ github.sha }}
          path: .ci/artifacts/backend
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: marketing-${{ github.sha }}
          path: .ci/artifacts/marketing
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: listing-checker-${{ github.sha }}
          path: .ci/artifacts/listing-checker
      - name: Verify trusted main and publish the scanned image
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          BACKEND_SHA256: ${{ needs.image.outputs.sha256 }}
          BACKEND_IMAGE_ID: ${{ needs.image.outputs.image-id }}
        run: sh scripts/ci/publish-image.sh
      - name: Install pinned Tailscale binaries
        run: sh scripts/ci/install-tailscale.sh
      - name: Deploy the tested backend revision and immutable image
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_CI_OAUTH_SECRET }}
        run: bash scripts/ci/send-release.sh
      - name: Deploy the tested marketing artifact
        if: needs.validate.outputs.marketing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MARKETING_SHA256: ${{ needs.validate.outputs.marketing-sha256 }}
        run: |
          sh scripts/ci/require-release.sh
          test "$(tr -d '\n' < .ci/artifacts/marketing/marketing.commit)" = "$GITHUB_SHA"
          : "${MARKETING_SHA256:?The marketing-sha256 output is required from the checks job}"
          printf '%s  .ci/artifacts/marketing/marketing.tar\n' "$MARKETING_SHA256" | sha256sum --check
          tar -C apps/www -xf .ci/artifacts/marketing/marketing.tar
          bun install --cwd apps/www --frozen-lockfile --ignore-scripts
          cd apps/www
          bunx wrangler deploy
      - name: Verify the deployed listing pages
        id: listings
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        env:
          LISTING_CHECKER_SHA256: ${{ needs.listing-checker.outputs.sha256 }}
        run: bash scripts/ci/verify-listings.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ !cancelled() && steps.listings.outcome != 'skipped' }}
        with:
          name: listing-check-${{ github.sha }}
          path: |
            .ci/listing-check.json
            .ci/listing-check.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
